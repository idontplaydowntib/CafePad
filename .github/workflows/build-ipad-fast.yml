name: Build CafePad iPad IPA with released core

# Manual app build using the exact EspressU v1.2 runtime core. The normal
# build-ipad workflow remains the full source-core build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafepad-ipad-fast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      CAFEPAD_CORE_STRATEGY: release
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out this commit without core submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Select shipping Xcode 27.0
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'

      - name: Install the build tools and Metal compiler
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja xcodegen pkg-config autoconf automake libtool
          xcodebuild -downloadComponent MetalToolchain

      - name: Build the app and local JIT helper with the pinned released core
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ci/*.sh
          bash ci/build-ipad.sh

      - name: Verify the packaged IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify-ipa.py build-ios/package/CafePad-unsigned.ipa

      - name: Upload the IPA, checksum and runtime core provenance
        uses: actions/upload-artifact@v4
        with:
          name: CafePad-iPad-released-core-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build-ios/package/CafePad-unsigned.ipa
            build-ios/package/SHA256SUMS.txt
            build-ios/package/build-provenance.json
            build-ios/package/runtime-core-provenance.json
            build-ios/package/BUILD-NOTES.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CafePad-released-core-build-logs-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build-ios/logs/
